[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C90", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "pymongo.*",
    "jose.*",
    "passlib.*",
    "google.oauth2.*",
    "google.auth.*",
    "pyotp.*",
    "stripe.*"
]
ignore_missing_imports = true
